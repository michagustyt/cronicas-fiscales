<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Crónicas Fiscales</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">Crónicas Fiscales</div>
                <h1>Crear Cuenta</h1>
                <p>Únete a nuestra comunidad de expertos en contabilidad fiscal</p>
            </div>
            
            <form id="registroForm" class="login-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                
                <!-- NUEVO: Selector de Rol -->
                <div class="form-group">
                    <label for="rol">Tipo de Cuenta</label>
                    <select id="rol" name="rol" required>
                        <option value="alumno">Alumno</option>
                        <option value="docente">Docente</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                
                <!-- Se le quitaron los "required" para que no bloquee -->
                <div id="seccion_clase" class="form-group">
                    <label for="docente_select">Selecciona a tu Docente</label>
                    <select id="docente_select" name="docente_select">
                        <option value="">— Sin Docente —</option>
                    </select>
                    
                    <label for="clase_select" style="margin-top: 10px; display: none;" id="label_clase">Selecciona tu Clase</label>
                    <select id="clase_select" name="clase_select" style="display: none;">
                        <option value="">— Selecciona la Clase —</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" required placeholder="Mínimo 6 caracteres">
                </div>
                
                <div class="form-group">
                    <label for="confirmar_contraseña">Confirmar Contraseña</label>
                    <input type="password" id="confirmar_contraseña" name="confirmar_contraseña" required placeholder="Confirma tu contraseña">
                </div>
                
                <button type="submit" class="btn-login">Crear Cuenta</button>
            </form>
            
            <div class="login-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
            
            <div id="errorMsg" class="error-message" style="display: none;"></div>
            <div id="successMsg" class="success-message" style="display: none;"></div>
        </div>
    </div>
    
    <!-- ES VITAL QUE DIGA type="module" -->
    <script type="module" src="js/registro.js"></script>
</body>
</html>
