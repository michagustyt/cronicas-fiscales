<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro de Alumno - Crónicas Fiscales</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-header">

                <div class="logo">
                    Crónicas Fiscales
                </div>

                <h1>Crear cuenta</h1>

                <p>
                    Registro exclusivo para alumnos
                </p>

            </div>


            <form
                id="registroForm"
                class="login-form"
            >

                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Juan Pérez"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contraseña">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contraseña"
                        name="contraseña"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmar_contraseña">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar_contraseña"
                        name="confirmar_contraseña"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="btnRegistro"
                    class="btn-login"
                >
                    Crear cuenta de alumno
                </button>

            </form>


            <div
                id="errorMsg"
                class="error-message"
                style="display: none;"
            ></div>


            <div
                id="successMsg"
                class="success-message"
                style="display: none;"
            ></div>


            <div class="login-footer">

                <p>
                    ¿Ya tienes cuenta?

                    <a href="login.html">
                        Inicia sesión
                    </a>
                </p>

                <p>
                    <a href="inicio.html">
                        ← Volver al inicio
                    </a>
                </p>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="js/registro.js"
    ></script>

</body>

</html>
