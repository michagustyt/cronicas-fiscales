<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Crónicas Fiscales</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >
</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-header">
                <div class="logo">
                    Crónicas Fiscales
                </div>

                <h1>El Origen del Godín</h1>

                <p>
                    Inicia sesión para continuar tu aventura
                </p>
            </div>


            <form
                id="loginForm"
                class="login-form"
            >

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="contraseña">
                        Contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="contraseña"
                            name="contraseña"
                            placeholder="Contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Mostrar u ocultar contraseña"
                        >
                            <i class="fas fa-eye"></i>
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    id="btnLogin"
                    class="btn-login"
                >
                    Iniciar Sesión
                </button>

            </form>


            <div
                id="errorMsg"
                class="error-message"
                style="display: none;"
            ></div>


            <div class="login-footer">

                <p>
                    ¿Eres alumno y aún no tienen cuenta?

                    <a href="registro.html">
                        Crear cuenta
                    </a>
                </p>

                <p>
                    <a href="inicio.html">
                        ← Volver al inicio
                    </a>
                </p>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="js/login.js"
    ></script>

</body>

</html>
