<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Crónicas Fiscales</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <!-- Aquíí estaban los errores, ya tienen el .css correcto -->
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">Crónicas Fiscales</div>
                <h1>El Origen del Godín</h1>
                <p>Inicia sesión para comenzar tu aventura</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="contraseña" name="contraseña" required placeholder="Contraseña">
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            
            <div class="login-footer">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
            
            <div id="errorMsg" class="error-message" style="display: none;"></div>
        </div>
    </div>
    
    <script type="module" src="js/login.js"></script>
</html>
