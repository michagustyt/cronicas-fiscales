<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ¡Felicidades, has completado Crónicas Fiscales!
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap"
        rel="stylesheet"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>

    <link
        rel="stylesheet"
        href="css/dark-mode.css"
    >

    <script src="js/theme.js"></script>


    <style>

        /* ========================================
           VARIABLES
        ======================================== */

        :root {
            --primary-color: #e76f51;
            --secondary-color: #f4a261;
            --accent-color: #e9c46a;

            --text-dark: #4f3422;
            --text-light: #fefefe;

            --bg-body-start: #fff1e6;
            --bg-body-end: #fde4e1;

            --bg-card: rgba(255, 250, 245, 0.92);

            --shadow-light:
                0 8px 20px rgba(80, 50, 30, 0.1);

            --shadow-heavy:
                0 15px 35px rgba(80, 50, 30, 0.2);
        }


        /* ========================================
           GENERAL
        ======================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            background-image:
                linear-gradient(
                    to top,
                    var(--bg-body-start),
                    var(--bg-body-end)
                );

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: 'Nunito', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            color: var(--text-dark);

            transition:
                background-image 1.2s ease-in-out;
        }


        .oculto {
            display: none !important;
        }


        /* ========================================
           CONTENEDOR
        ======================================== */

        .final-container {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            position: relative;

            background-image:
                url('./assets/fondovictoria.png');

            background-size: cover;
            background-position: center;
        }


        /* ========================================
           TARJETA
        ======================================== */

        .final-card {
            background: var(--bg-card);

            padding: 60px 50px;

            border-radius: 35px;

            box-shadow: var(--shadow-heavy);

            max-width: 700px;
            width: 90%;

            text-align: center;

            border:
                5px solid var(--accent-color);

            animation:
                fadeInScale 1.5s ease;
        }


        .final-card h1 {
            font-family:
                'Fredoka One',
                cursive;

            font-size: 3.5rem;

            color: var(--primary-color);

            margin-bottom: 25px;

            text-shadow:
                2px 2px 0 var(--text-light);

            line-height: 1.2;
        }


        .final-card p {
            font-size: 1.3rem;

            margin: 20px 0;

            color: var(--text-dark);

            font-weight: 500;

            line-height: 1.6;
        }


        .final-card p strong {
            color: var(--primary-color);
            font-weight: 700;
        }


        /* ========================================
           BOTONES
        ======================================== */

        .button-group {
            margin-top: 40px;

            display: flex;

            flex-direction: column;

            gap: 20px;

            align-items: center;
        }


        .final-card button {
            background:
                var(--primary-color);

            border: none;

            color:
                var(--text-light);

            padding:
                15px 40px;

            border-radius: 30px;

            font-weight: 700;

            font-size: 1.2rem;

            cursor: pointer;

            transition:
                all 0.3s ease;

            width: 100%;
            max-width: 300px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.2);
        }


        .final-card button:hover {
            background:
                var(--secondary-color);

            color:
                var(--text-dark);

            transform:
                scale(1.05);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.3);
        }


        .final-card button.secondary {
            background:
                var(--secondary-color);

            color:
                var(--text-dark);
        }


        .final-card button.secondary:hover {
            background:
                var(--primary-color);

            color:
                var(--text-light);
        }


        /* ========================================
           MÚSICA
        ======================================== */

        .music-button {
            position: absolute;

            top: 20px;
            right: 20px;

            background:
                var(--secondary-color);

            color:
                var(--text-dark);

            padding:
                8px 15px;

            border-radius: 20px;

            font-size: 0.9rem;

            font-weight: 700;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.1);

            border: none;

            cursor: pointer;

            transition:
                all 0.2s ease;

            z-index: 10;
        }


        .music-button:hover {
            background:
                var(--primary-color);

            color:
                var(--text-light);

            transform:
                translateY(-2px);
        }


        /* ========================================
           ANIMACIONES
        ======================================== */

        @keyframes fadeInScale {

            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* ========================================
           SWEETALERT
        ======================================== */

        .swal-custom-popup {
            border-radius:
                20px !important;

            border:
                3px solid
                var(--accent-color) !important;

            box-shadow:
                0 15px 40px
                rgba(80, 50, 30, 0.3) !important;

            background:
                var(--bg-card) !important;
        }


        .swal-custom-title {
            font-family:
                'Fredoka One',
                cursive !important;

            color:
                var(--primary-color) !important;

            font-size:
                1.8rem !important;
        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 768px) {

            .final-card h1 {
                font-size: 2.5rem;
            }

            .final-card p {
                font-size: 1.1rem;
            }

            .final-card button {
                font-size: 1rem;

                padding:
                    12px 30px;
            }

            .final-card {
                padding:
                    40px 30px;
            }
        }

    </style>

</head>


<body>

    <button
        id="configBtn"
        class="config-btn"
    >
        ⚙️ Configuración
    </button>


    <div class="final-container">

        <button
            id="musicButton"
            class="music-button"
        >
            <span>🎵</span>
            Música
        </button>


        <div class="final-card">

            <h1 id="finalTitle">
                ¡Felicitaciones!
            </h1>


            <p>
                <strong>
                    <span id="playerName">
                        Jugador
                    </span>
                </strong>,
                ¡lo lograste!
            </p>


            <p>
                Has navegado con éxito a través
                de las complejidades del mundo
                fiscal y has emergido como un
                verdadero experto.
            </p>


            <p>
                Las finanzas ya no tienen secretos
                para ti.

                <strong>
                    ¡Ahora eres el Godín definitivo!
                </strong>
            </p>


            <div class="button-group">

                <button id="backDashboardButton">
                    Volver a mi panel
                </button>


                <button
                    id="creditsButton"
                    class="secondary"
                >
                    Créditos
                </button>

            </div>

        </div>

    </div>


    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    >
        <source
            src="./assets/audio.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script type="module">

        import {
            supabase
        } from './js/supabase.js';


        /* ========================================
           ELEMENTOS
        ======================================== */

        const playerNameEl =
            document.getElementById(
                'playerName'
            );

        const backDashboardButton =
            document.getElementById(
                'backDashboardButton'
            );

        const creditsButton =
            document.getElementById(
                'creditsButton'
            );

        const musicButton =
            document.getElementById(
                'musicButton'
            );

        const backgroundMusic =
            document.getElementById(
                'backgroundMusic'
            );


        let isMusicPlaying = false;

        let rolUsuario = null;


        /* ========================================
           REDIRECCIÓN SEGÚN ROL
        ======================================== */

        function volverAlDashboard() {

            switch (rolUsuario) {

                case 'alumno':
                    window.location.replace(
                        'dashboard_alumno.html'
                    );
                    break;


                case 'docente':
                    window.location.replace(
                        'dashboard_docente.html'
                    );
                    break;


                case 'admin':
                    window.location.replace(
                        'dashboard_admin.html'
                    );
                    break;


                default:
                    window.location.replace(
                        'login.html'
                    );
            }
        }


        /* ========================================
           MÚSICA
        ======================================== */

        async function reproducirMusica() {

            if (isMusicPlaying) {
                return;
            }


            try {

                await backgroundMusic.play();

                isMusicPlaying = true;

                musicButton.innerHTML =
                    '<span>🔇</span> Silencio';


            } catch {

                // Los navegadores pueden bloquear
                // el autoplay hasta que el usuario
                // interactúe con la página.
            }
        }


        musicButton.addEventListener(
            'click',
            async () => {

                if (isMusicPlaying) {

                    backgroundMusic.pause();

                    isMusicPlaying = false;

                    musicButton.innerHTML =
                        '<span>🎵</span> Música';

                    return;
                }


                await reproducirMusica();
            }
        );


        /* ========================================
           CRÉDITOS
        ======================================== */

        creditsButton.addEventListener(
            'click',
            () => {

                Swal.fire({

                    title:
                        '¡Felicidades por completar el juego!',

                    html: `
                        <div
                            style="
                                text-align: left;
                                line-height: 1.6;
                            "
                        >

                            <h3
                                style="
                                    color: var(--primary-color);
                                    margin-bottom: 10px;
                                "
                            >
                                Créditos
                            </h3>


                            <p>
                                <strong>
                                    Docentes:
                                </strong>

                                <br>

                                Profesora Benedicta
                                Domínguez

                                <br>

                                Doctora Miriam Olvera
                            </p>


                            <p>
                                <strong>
                                    Desarrollo:
                                </strong>

                                <br>

                                Crónicas Fiscales
                            </p>


                            <p>
                                <strong>
                                    Carrera:
                                </strong>

                                <br>

                                Ingeniería en Sistemas
                                Computacionales
                            </p>

                        </div>
                    `,

                    icon: 'success',

                    confirmButtonText:
                        '¡Genial!',

                    confirmButtonColor:
                        '#e76f51',

                    customClass: {
                        popup:
                            'swal-custom-popup',

                        title:
                            'swal-custom-title'
                    }

                });
            }
        );


        /* ========================================
           PANTALLA FINAL
        ======================================== */

        async function iniciarPantallaFinal() {

            try {

                /* =========================
                   SESIÓN
                ========================= */

                const {
                    data: {
                        session
                    },
                    error: sessionError
                } = await supabase.auth
                    .getSession();


                if (sessionError) {
                    throw sessionError;
                }


                if (!session) {

                    window.location.replace(
                        'login.html'
                    );

                    return;
                }


                /* =========================
                   USUARIO
                ========================= */

                const {
                    data: usuario,
                    error: usuarioError
                } = await supabase
                    .from('usuarios')
                    .select(
                        'nombre, rol'
                    )
                    .eq(
                        'id',
                        session.user.id
                    )
                    .single();


                if (usuarioError) {
                    throw usuarioError;
                }


                if (
                    !usuario ||
                    !usuario.nombre ||
                    !usuario.rol
                ) {
                    throw new Error(
                        'No fue posible obtener ' +
                        'los datos del usuario.'
                    );
                }


                /* =========================
                   MOSTRAR INFORMACIÓN
                ========================= */

                playerNameEl.textContent =
                    usuario.nombre;

                rolUsuario =
                    usuario.rol;


                /* =========================
                   MÚSICA
                ========================= */

                await reproducirMusica();


            } catch (error) {

                console.error(
                    'Error cargando pantalla final:',
                    error
                );


                window.location.replace(
                    'login.html'
                );
            }
        }


        /* ========================================
           EVENTOS
        ======================================== */

        backDashboardButton.addEventListener(
            'click',
            volverAlDashboard
        );


        /* ========================================
           INICIO
        ======================================== */

        iniciarPantallaFinal();

    </script>

</body>

</html>
